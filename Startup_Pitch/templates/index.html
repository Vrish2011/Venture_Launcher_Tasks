<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Startup Pitch generator</title>
        <style>
        
            #wrapper{
                position: fixed;
                top:0%;
                left:0%;
                width:100%;
                height:100%;
                background-color: rgb(200,200,200)
            }

            body{
                padding: 10px 10px;
            }
            #Pitch_Form{
                position:fixed;
                width: 40%;
                top:3.5%;
                height:80%;
                background-color:white;
                left:3%;
                padding: 3% 3%;
                padding-left: 8%
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                font-size: 30px;
            }

            .Product_select{
                position: absolute;
                width: 50%;
                height: 5%;
                top: 30%;
                left:35%;
                padding: 0px 3%;
                border-radius:30px;
                margin-left: 5%;
                font-size:20px;
                

   
    
              
            }
            .Product_select:focus{
                border:2px solid grey;
            }

            @keyframes spin{
                from{
                    transform: rotate(0deg)

                }

                to{
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>

    <body>
        <div id="wrapper"></div>

        


        <script>
            function setup_initial(){
                const form = document.createElement("form")
                form.id = "Pitch_Form"
                document.body.appendChild(form)
                const header = document.createElement("h1")
                header.textContent = "Startup Details"
                form.appendChild(header)
                
                
                const Product_select = document.createElement("select")
                Product_select.id = "Product_Stage"
                Product_select.required = true
                const default_option = document.createElement("option")
                default_option.disabled = true
                default_option.selected = true
                default_option.textContent = "Select Stage"
                Product_select.appendChild(default_option)
                Product_select.className = "Product_select"
                const option_Idea = document.createElement("option")
                option_Idea.textContent = "Idea"
                option_Idea.value = "Idea"
                Product_select.appendChild(option_Idea)
                const option_MVP = document.createElement("option")
                option_MVP.textContent = "MVP"
                option_MVP.value = "MVP"
                Product_select.appendChild(option_MVP)
                const option_Revenue = document.createElement("option")
                option_Revenue.textContent = "Early Revenue"
                option_Revenue.value = "Early Revenue"
                Product_select.appendChild(option_Revenue)
                
                
                form.appendChild(Product_select)
                const label_product = document.createElement("label")
                label_product.setAttribute("for", "Product_Stage")
                label_product.textContent = "Select Product Stage:"
                label_product.style.position = "absolute"
                label_product.style.top = "30%"
                label_product.style.left = "1%"
                form.appendChild(label_product)
                const h2 = document.createElement("h2")
                h2.textContent = "Startup Description"
                h2.style.position = "absolute"
                h2.style.top = "35%"
                form.appendChild(h2)
                
                const startup_textarea = document.createElement("textarea")
                startup_textarea.placeholder = "Paste your startup description and we’ll generate a short investor‑ready pitch."
                startup_textarea.style.position = "absolute"
                startup_textarea.style.width = "80%"
                startup_textarea.style.height = "20%"
                startup_textarea.style.padding = "2% 2%"
                startup_textarea.required = true
                
               
                startup_textarea.style.top = "55%"
                form.appendChild(startup_textarea)

                const generate_pitch = document.createElement("button")
                generate_pitch.style.backgroundColor = "rgb(0, 0, 255)"
                
                generate_pitch.style.color = "white"
                generate_pitch.style.top = "90%"
                generate_pitch.style.position = "absolute"
                generate_pitch.type = "submit"
                
                generate_pitch.style.borderRadius = "999px"
                generate_pitch.style.width = "50%"
                generate_pitch.style.height = "5%"
                generate_pitch.style.border = "none"
                generate_pitch.style.fontSize = "20px"
                generate_pitch.textContent = "Generate Pitch"
                generate_pitch.style.transition = "all 0.3s ease"
                generate_pitch.onmouseover = function(){
                    generate_pitch.style.backgroundColor = "rgb(0, 0, 125)"
                    generate_pitch.style.cursor = "pointer"
                    
                }

                generate_pitch.onmouseout = function(event){
                    generate_pitch.style.backgroundColor = "rgb(0, 0, 255)"
                }

                
                
                form.appendChild(generate_pitch)

                

                const Pitch_div = document.createElement("div")
                Pitch_div.contentEditable = true
                Pitch_div.style.position = "absolute"
                Pitch_div.style.width = "40%"
                Pitch_div.style.left = "50%"
                Pitch_div.style.top = "20%"
                Pitch_div.style.padding = "50px 30px"
                
                Pitch_div.style.height = "60%"
                Pitch_div.style.fontSize = "30px"
                Pitch_div.style.backgroundColor = "rgb(255, 255, 255)"
                Pitch_div.style.borderRadius = "5%"
                Pitch_div.style.display = "flex"
                Pitch_div.style.justifyContent = "center"
                Pitch_div.style.alignItems = "center"
                document.body.appendChild(Pitch_div)
                const Header = document.createElement("h1")
                Header.textContent = "The Startup Pitch"
                Header.style.backgroundColor = "white"
                Header.style.padding = "20px 20px"
                Header.style.width = "40%"
                Header.style.position = "absolute"
                Header.style.top = "1%"
                Header.style.left = "50%"
                document.body.appendChild(Header)
                form.onsubmit = function(event){
                    event.preventDefault()
                    Pitch_div.style.filter = "blur(2.5px)"
                    const spinner = document.createElement("div")
                    generate_pitch.disabled = true
                    
                    spinner.style.backgroundColor = "rgb(255,255,255)"
                    spinner.style.border = "5px solid black"
                    spinner.style.borderTop = "5px solid lightgray"
                    spinner.style.borderRadius = "50%"
                    spinner.style.width = "200px"
                    spinner.style.height = "200px"
                    spinner.style.animation= "spin 1s linear infinite";
                    spinner.style.position = "absolute"
                    spinner.style.left = "65%"
                    spinner.style.top = "47.5%"
                    document.body.appendChild(spinner)
                    fetch("/generate_pitch", {method: "POST", headers : {"Content-type": "application/json"}, body: JSON.stringify({ProductStage: Product_select.value, StartupDescription: startup_textarea.value})})
                    .then(response => response.json())
                    .then(function(data){
                        generate_pitch.disabled = false
                        if(data.error){
                            const overlay = document.createElement("div")
                            overlay.style.backgroundColor = "black"
                            overlay.style.opacity = "0.5"
                            overlay.style.position = "fixed"
                            overlay.style.top = "0%"
                            overlay.style.left = "0%"
                            overlay.style.width = "100%"
                            overlay.style.height = "100%"
                            document.body.appendChild(overlay)
                            const err_message = document.createElement("div")
                            err_message.style.position = "fixed"
                            err_message.style.padding = "40px 30px"
                            const h3 = document.createElement("h2")
                            h3.textContent = "Error"
                            h3.style.position = "absolute"
                            h3.style.top = "20%"

                            
                            err_message.appendChild(h3)
                            
                            
                            err_message.style.backgroundColor = "white"
                            err_message.style.left = "50%"
                            err_message.style.top = "20%"
                            
                            err_message.style.width = "400px"
                            err_message.style.height = "300px"
                            err_message.style.display = "flex"
                            err_message.style.justifyContent = "center"
                            err_message.style.alignItems = "center"
                        
                            err_message.innerHTML = err_message.innerHTML + `${data.error}`
                            document.body.appendChild(err_message)
                            const button = document.createElement("button")
                            button.style.backgroundColor = "blue"
                            button.style.color = "white"
                            button.style.width = "100px"
                            button.style.height = "50px"
                            button.style.border = "none"
                            button.textContent = "Cancel"
                            button.style.position = "absolute"
                            button.style.top = "80%"
                            button.style.left = "10%"
                            button.onclick = function(event){
                                err_message.remove()
                                overlay.remove()
                            }

                            
                            err_message.appendChild(button)
                            const button_retry = document.createElement("button")
                            button_retry.style.backgroundColor = "blue"
                            button_retry.style.color = "white"
                            button_retry.style.width = "100px"
                            button_retry.style.height = "50px"
                            button_retry.style.border = "none"
                            button_retry.textContent = "Retry"
                            button_retry.style.position = "absolute"
                            button_retry.style.top = "80%"
                            button_retry.style.left = "70%"
                            button_retry.onclick = function(event){
                                overlay.remove()
                                err_message.remove()
                                generate_pitch.click()
                            }
                            err_message.appendChild(button_retry)


                            
                        }

                        else{
                            Pitch_div.textContent = `${data.pitch}`
                        }
                        
                        Pitch_div.style.filter = ""

                        spinner.remove()
                        
                        
                        
                        
                    })



                    
                }

                const button = document.createElement("button")
                button.style.backgroundColor = "blue"
                button.style.position = "absolute"
                button.style.top = "4.5%"
                button.style.left = "75%"
                button.style.border = "none"
                button.textContent = "How to Use"
                button.style.fontSize = "30px"
                button.style.width = "300px"
                button.style.height = "90px"
                button.style.color = "white"
                button.onclick = function(event){
                    const overlay = document.createElement("div")
                    overlay.style.backgroundColor = "Grey"
                    overlay.style.opacity = "0.5"
                    overlay.style.position = "absolute"
                    overlay.style.top = "0%"
                    overlay.style.left = "0%"

                    overlay.style.width = "100%"
                    overlay.style.height = "100%"
                    document.body.appendChild(overlay)
                    const overlay_div = document.createElement("div")
                    overlay_div.style.position = "fixed"
                    document.body.appendChild(overlay_div)
                    overlay_div.style.backgroundColor = "white"
                    overlay_div.style.width = "900px"
                    overlay_div.style.top = "0%"
                    overlay_div.style.left = "20%"
                    overlay_div.style.height = "700px"
                    overlay_div.style.padding = "30px 30px"
                    overlay_div.style.zIndex = "1"
                    document.addEventListener("keydown", function(event){
                        if(event.key == "Escape"){
                            overlay.remove()
                            overlay_div.remove()
                        }
                    })

                    overlay_div.innerHTML = "<section style='display:flex; gap:16px; align-items:stretch; overflow-x:auto; padding-bottom:10px;'><div style='min-width:200px; max-width:220px; padding:14px; border:1px solid #ddd; border-radius:10px;'><h3>How to Structure Your Prompt</h3><p>A strong startup prompt gives clear details so the AI or investor can understand your business quickly. Include the problem, solution, target user, and current stage to make your pitch more specific and useful.</p></div><div style='min-width:200px; max-width:220px; padding:14px; border:1px solid #ddd; border-radius:10px;'><h4>1. Problem</h4><p><strong>What problem are you solving?</strong></p><p>Explain the pain point clearly. Say what is difficult, expensive, slow, confusing, or inefficient.</p><p><strong>Why this helps:</strong> Investors need to know that your startup is solving a real problem, not just building a random product.</p><p><em>Example:</em> Small grocery stores lose money because they overstock vegetables without knowing weekly demand.</p></div><div style='min-width:200px; max-width:220px; padding:14px; border:1px solid #ddd; border-radius:10px;'><h4>2. Solution</h4><p><strong>How does your startup solve it?</strong></p><p>Describe your product or service in simple words. Focus on what it does and the value it gives.</p><p><strong>Why this helps:</strong> This makes your pitch easier to understand and shows how your startup directly fixes the problem.</p><p><em>Example:</em> Our app predicts weekly vegetable demand using past sales data and local buying patterns.</p></div><div style='min-width:200px; max-width:220px; padding:14px; border:1px solid #ddd; border-radius:10px;'><h4>3. Target User</h4><p><strong>Who is this built for?</strong></p><p>Mention the specific users or customers who will use or pay for your product.</p><p><strong>Why this helps:</strong> Investors want to see that you know your market and are not trying to sell to everyone.</p><p><em>Example:</em> Our target users are small grocery store owners and local vegetable retailers.</p></div><div style='min-width:200px; max-width:220px; padding:14px; border:1px solid #ddd; border-radius:10px;'><h4>4. Current Stage</h4><p><strong>How far have you progressed?</strong></p><p>Say whether you are at the idea, prototype, MVP, early users, revenue, or growth stage.</p><p><strong>Why this helps:</strong> This helps investors understand your progress, risk level, and what kind of funding or support you need.</p><p><em>Example:</em> We have built an MVP, tested it with 12 stores, and are preparing for a paid pilot.</p></div></section>"

                }
                document.body.appendChild(button)



                
            }

            setup_initial()
        </script>

    </body>
    
</html>
